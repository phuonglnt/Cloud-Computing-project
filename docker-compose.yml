services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: always

volumes:
  open-webui:
